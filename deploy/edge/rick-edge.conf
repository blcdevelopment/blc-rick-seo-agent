# Edge proxy of the Rick edition on the shared BLC Linode (service `rick-edge`,
# docker-compose.prod.yml). Mounted as /etc/nginx/conf.d, so it replaces the image's default
# server. deploy/deploy.sh runs `nginx -t`, then a graceful `nginx -s reload`, on every deploy.
#
# blc-social-audit's Caddy terminates TLS for seo.builderleadconverter.com and forwards every
# request here, to blc-rick-edge:80 on the shared blc-edge network. This is the only container
# of the stack on that network (DEPLOYMENT.md §2). It routes to the api and the frontend on the
# stack's own network, and it limits how fast audits can be started.

# The visitor's address. The parent's Caddy replaces any X-Forwarded-For a visitor sends with
# the real client address, so it is trusted from the private Docker ranges Caddy connects
# from, and nowhere else.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Docker's embedded DNS. The upstreams are named through variables, so nginx looks them up per
# request: it starts while the api is still booting, and it follows a recreated container to
# its new address. The names are aliases only this stack's network has (never blc-edge).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Only requests that change something are limited. Starting an audit is POST /api/audits;
# polling it and reading reports are GETs and are never limited. A request whose key is
# empty is not counted.
map $request_method $rick_write_by_visitor {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
map $request_method $rick_write_by_anyone {
    default "";
    POST    "all";
    PUT     "all";
    PATCH   "all";
    DELETE  "all";
}
# One visitor: 3 at once, then one a minute. Everyone together: 20 at once, then 10 a minute.
# The single worker runs one audit at a time (~8-10 minutes each), so these stop floods and
# scripted abuse; they are not a quota. Over the limit, the answer is 429.
limit_req_zone $rick_write_by_visitor zone=rick_write_visitor:10m rate=1r/m;
limit_req_zone $rick_write_by_anyone zone=rick_write_all:1m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

map $http_upgrade $rick_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # An audit request is a small JSON body.
    client_max_body_size 1m;

    set $rick_api blc-rick-api:8000;
    set $rick_frontend blc-rick-frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Passed on unchanged: the visitor's address and https, as the parent's Caddy set them.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $rick_connection_upgrade;
    # Report PDFs and DOCX files can take a while to render.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # This proxy's own liveness, for the Docker health check. Never forwarded.
    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API, with the /api prefix stripped, as the parent's `handle_path /api/*` does:
    # /api/audits -> http://blc-rick-api:8000/audits
    location /api/ {
        limit_req zone=rick_write_visitor burst=3 nodelay;
        limit_req zone=rick_write_all burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$rick_api;
    }

    # Everything else is the Next.js site.
    location / {
        proxy_pass http://$rick_frontend;
    }
}
