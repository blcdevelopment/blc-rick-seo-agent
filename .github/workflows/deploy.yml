name: Deploy

# Deploys main to the shared BLC Linode (https://seo.builderleadconverter.com), the way
# blc-board, blc-ep, blc-dr and blc-blogs are deployed: the committed deploy/deploy.sh is streamed
# over SSH with the exact commit, and the box builds and starts only this stack
# (DEPLOYMENT.md §5).
#
# Manual for now: Actions -> Deploy -> Run workflow, on main. A merge deploys nothing until the
# box, its .env and the secrets below exist, or every merge would end in a failed job. Once the
# first manual deploy is healthy, adding `push: branches: [main]` under `on:` makes it
# automatic.
#
# This repository is public. GitHub never passes secrets to pull requests from forks, and only
# people with write access can run this workflow. The secrets are named RICK_DEPLOY_* so that
# organisation-level DEPLOY_* secrets can never be picked up here by accident. Values: the same
# box and the same GitHub Actions key as blc-board / blc-ep / blc-dr use (DEPLOYMENT.md §5,
# step 7).
#   RICK_DEPLOY_HOST         173.255.206.170
#   RICK_DEPLOY_USER         abdullah
#   RICK_DEPLOY_SSH_KEY      private half of the GitHub Actions -> Linode key
#   RICK_DEPLOY_KNOWN_HOSTS  pinned `ssh-keyscan 173.255.206.170` output
#   RICK_DEPLOY_PORT         optional SSH port (defaults to 22)

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-rick-seo-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Require main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Deploy from main only (this run is on $REF)."
            exit 1
          fi

  checks:
    name: Checks on the exact commit
    needs: release-gate
    uses: ./.github/workflows/pre-commit.yml

  deploy:
    name: Deploy to the shared Linode
    needs: [release-gate, checks]
    runs-on: ubuntu-latest
    # deploy.sh may first wait up to 30 minutes for the box's shared deploy lock, then builds
    # three images one at a time.
    timeout-minutes: 75
    environment:
      name: production
      url: https://seo.builderleadconverter.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy the exact commit over SSH
        env:
          DEPLOY_HOST: ${{ secrets.RICK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.RICK_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.RICK_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.RICK_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.RICK_DEPLOY_PORT }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] \
             || [ -z "${DEPLOY_SSH_KEY}" ] || [ -z "${DEPLOY_KNOWN_HOSTS}" ]; then
            echo "::error::Missing deploy secrets. Set RICK_DEPLOY_HOST, RICK_DEPLOY_USER, RICK_DEPLOY_SSH_KEY, RICK_DEPLOY_KNOWN_HOSTS."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Stream the committed deploy script to the box and run it there, pinned to the exact
          # commit of this run ($GITHUB_SHA, a plain hex SHA from the runner env, not
          # interpolated). IdentitiesOnly keeps ssh from offering other keys;
          # StrictHostKeyChecking=yes enforces the pinned known_hosts.
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              'bash -s' -- "${GITHUB_SHA}" < deploy/deploy.sh
